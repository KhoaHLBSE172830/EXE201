services:
  postgres:
    image: postgres:16-alpine
    container_name: mimo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mimo_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mimo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mimo_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mimo_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@mimo.app}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-Admin123!}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - mimo_network

  redis:
    image: redis:7-alpine
    container_name: mimo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mimo_network

  mimo-api:
    image: mimo-api:latest
    container_name: mimo_api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Mimo.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - APPLY_MIGRATIONS=true
      - ENABLE_SWAGGER=true
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection:-Host=postgres;Port=5432;Database=mimo_db;Username=postgres;Password=123456}
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Secret=${JWT_SECRET:-0ebe2440a9eba77bed3a7a081b9bb26d792baaec3fcac1eae95b7148bfdcb8c5}
      - Supabase__Url=${SUPABASE_URL:-https://axbejjdzsuelscpkuwab.supabase.co}
      - Supabase__ApiKey=${SUPABASE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4YmVqamR6c3VlbHNjcGt1d2FiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1OTQwMTAsImV4cCI6MjEwODE3MDAxMH0.PWiw41N00U2pcpap0WdUzZ1gaqMzVOBLhJDC_H1_XrU}
      - Supabase__BucketName=${SUPABASE_BUCKET:-mimo-assets}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - mimo_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local

networks:
  mimo_network:
    driver: bridge
